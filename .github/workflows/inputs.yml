on:
  push:
    branches: main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      print_tags:
        description: 'True to print to STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test scenario tags'
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true
      job_to_run:
        description: 'Select the job to run'
        required: true
        default: 'build'
        type: jobs

jobs:
  print-tag:
    if: ${{inputs.environment == 'teste'}}
    environment: teste
    runs-on: ubuntu-latest
    steps:
      - name: Print the input tag to STDOUT
        run: echo  The tags are ${{ inputs.tags }} 
  print-tag1:
    runs-on: ubuntu-latest
    if:  ${{ inputs.environment == 'teste1' }} 
    steps:
      - name: Print the input tag to STDOUT
        run: echo  The tags are ${{ inputs.tags }} 
